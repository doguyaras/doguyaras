# Blueprint iskeletinin CI'i (referans Bolum 18.3, 16). Ucuncu taraf action'lar commit SHA'ya pinli (tag'ler mutable).
name: skeleton-ci
on:
  push:
    branches: ['claude/**']
    paths: ['blueprint/**', '.github/workflows/skeleton-ci.yml']
  pull_request:
    paths: ['blueprint/**', '.github/workflows/skeleton-ci.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scripts-and-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24' }
      - name: flyway immutability script tests
        run: node --test blueprint/scripts/flyway-immutability.test.js
      - name: migration immutability check (PR only, against base)
        if: github.event_name == 'pull_request'
        run: node blueprint/scripts/flyway-immutability.js check --base "origin/${{ github.base_ref }}"
      - name: hook dry-runs (bash -n + sample stdin)
        # Hook'lar CLAUDE_PROJECT_DIR'i MUTLAK yol ister; flyway hook'u base'teki V dosyasina yazmayi engeller (exit 2),
        # yeni V dosyasina izin verir (exit 0), yapilandirma hatasinda da engeller (fail-closed).
        run: |
          set -euo pipefail
          export CLAUDE_PROJECT_DIR="$PWD/blueprint"
          export FLYWAY_BASE_REF=HEAD   # kuru calistirma: HEAD agacindaki V dosyasi "base'te var" sayilsin (repo'nun gercek base branch'inden bagimsiz)
          for h in blueprint/.claude/hooks/*.sh; do bash -n "$h"; done
          OUT=$(echo '{"tool_input":{"command":"git push"}}' | blueprint/.claude/hooks/review-gate.sh)
          echo "$OUT" | grep -q '"permissionDecision":"ask"' || { echo "review-gate did not ask"; exit 1; }
          PROTECTED='{"tool_input":{"file_path":"'"$PWD"'/blueprint/skeleton-example/order-core/src/main/resources/db/migration/V1__init.sql"}}'
          if echo "$PROTECTED" | node blueprint/.claude/hooks/flyway-immutability.js; then echo "hook allowed a base migration edit"; exit 1; fi
          NEWFILE='{"tool_input":{"file_path":"'"$PWD"'/blueprint/skeleton-example/order-core/src/main/resources/db/migration/V99__new.sql"}}'
          echo "$NEWFILE" | node blueprint/.claude/hooks/flyway-immutability.js
          if echo "$PROTECTED" | CLAUDE_PROJECT_DIR=relative/path node blueprint/.claude/hooks/flyway-immutability.js; then echo "hook must fail closed on misconfiguration"; exit 1; fi
      - name: config lint (if present)
        run: test -f blueprint/scripts/config-lint.js && node --test blueprint/scripts/config-lint.test.js || echo "config-lint not present yet"
  skeleton:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.3-management
        ports: ['5672:5672', '15672:15672', '5552:5552']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: local infra binaries used by tests (redis-server, pgbouncer)
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server pgbouncer && sudo systemctl stop redis-server pgbouncer || true
      - name: build and test (embedded PostgreSQL 18 runs as the non-root runner user; broker chaos test reaches rabbitmqctl inside the service container)
        env:
          BVT_RABBITMQCTL: docker exec ${{ job.services.rabbitmq.id }} rabbitmqctl
          BVT_RABBITMQ_NODE: local
        run: mvn -B -ntp -f blueprint/skeleton-example/pom.xml verify
      - name: test count guard (0 test = failure is per module; here the total must not silently shrink)
        run: |
          total=$(grep -ho 'tests="[0-9]*"' blueprint/skeleton-example/*/target/surefire-reports/TEST-*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "total tests: $total"; test "$total" -ge 50
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with: { name: surefire-reports, path: blueprint/skeleton-example/*/target/surefire-reports/ }
